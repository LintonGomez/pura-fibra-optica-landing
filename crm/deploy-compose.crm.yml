services:
  pfo-crm:
    build:
      context: ./pfo-crm
    container_name: pfo-crm
    restart: unless-stopped
    env_file:
      - /etc/pfo-crm/pfo-crm-db.env
      - /etc/pfo-crm/pfo-crm-auth.env
    environment:
      PORT: "8091"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: pura_fibra
      PFO_CRM_ALLOWED_ORIGIN: https://purafibraoptica.opentelecomai.com
      PFO_CRM_COOKIE_PATH: /crm/
    ports:
      - "127.0.0.1:8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
